name: Verify downloadable Android release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v2.0.0
permissions:
  contents: read
jobs:
  install-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download complete release files and verify checksums
        run: |
          mkdir -p downloaded
          cd downloaded
          BASE="https://github.com/tatheer583/Khidmat-App/releases/download/$RELEASE_TAG"
          for FILE in khidmat-universal.apk SHA256SUMS; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "$BASE/$FILE" -o "$FILE"
          done
          python3 ../scripts/verify_release.py .
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "https://github.com/tatheer583/Khidmat-App/releases/download/v1.4.0/khidmat-universal.apk" -o previous.apk
          echo '25d56ce175642dca8916754da70873af93f86e07554a53d75f58364c4911f72a  previous.apk' | sha256sum --check -
      - name: Verify retained release signing certificate
        run: |
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          for APK in downloaded/*.apk; do
            CERT=$("$SIGNER" verify --verbose --print-certs --min-sdk-version 24 "$APK" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
            test "$CERT" = '7c680b76c6d8ba235ebc72b68b05038ecaddb0d38e7d776f977695db2cdacebd'
            if [ "$APK" != downloaded/previous.apk ]; then
              "$AAPT" dump badging "$APK" | grep "package: name='com.khidmat.khidmat' versionCode='5003' versionName='2.0.0'"
              "$AAPT" dump badging "$APK" | grep -E "^(sdkVersion|minSdkVersion):'24'$"
              "$ZIPALIGN" -c -P 16 4 "$APK"
            fi
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 scripts/smoke_android.py downloaded/previous.apk --expected-version 5002 --evidence-name previous
            python3 scripts/smoke_android.py downloaded/khidmat-universal.apk --offline --exercise-local-flow --initial-language ur --evidence-name universal-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-install-api-${{ matrix.api }}
          path: smoke-evidence/
