name: Build signed Android download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_security.mjs
      - run: node --test test/security_scripts_test.mjs
      - run: node --test scripts/verify_marketplace_backend.test.mjs
      - name: Validate public marketplace release configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          KHIDMAT_SUPPORT_EMAIL: ${{ vars.KHIDMAT_SUPPORT_EMAIL }}
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ vars.FIREBASE_IOS_BUNDLE_ID }}
        run: node scripts/configure_release.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Prepare project
        shell: pwsh
        run: ./scripts/Prepare-Android.ps1
      - name: Restore private signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          assert all(os.environ.get(k) for k in ('KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')), 'Missing signing secrets'
          key = Path(os.environ['GITHUB_WORKSPACE']) / 'android/khidmat-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('android/key.properties').write_text('\n'.join([
              'storeFile=' + str(key),
              'storePassword=' + escape(os.environ['STORE_PASSWORD']),
              'keyPassword=' + escape(os.environ['KEY_PASSWORD']),
              'keyAlias=' + escape(os.environ['KEY_ALIAS']),
          ]) + '\n')
          PY
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build single universal Android APK
        run: flutter build apk --release --no-pub --dart-define-from-file=config/marketplace.json
      - name: Check signer, package, version and native alignment
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/khidmat-universal.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          CERT=$("$TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 24 release/khidmat-universal.apk | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
          test "$CERT" = '7c680b76c6d8ba235ebc72b68b05038ecaddb0d38e7d776f977695db2cdacebd'
          "$TOOLS/aapt2" dump badging release/khidmat-universal.apk | grep "package: name='com.khidmat.khidmat' versionCode='5005' versionName='2.1.1'"
          "$TOOLS/aapt2" dump badging release/khidmat-universal.apk | grep -E "^(sdkVersion|minSdkVersion):'24'$"
          "$TOOLS/zipalign" -c -P 16 4 release/khidmat-universal.apk
          "$TOOLS/aapt2" dump permissions release/khidmat-universal.apk | grep -q android.permission.INTERNET
          if "$TOOLS/aapt2" dump permissions release/khidmat-universal.apk | grep -q android.permission.ACCESS_BACKGROUND_LOCATION; then
            echo 'Background location is prohibited; marketplace location is foreground only'
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          apk = Path('release/khidmat-universal.apk')
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          Path('release/SHA256SUMS').write_text(digest + '  khidmat-universal.apk\n')
          Path('release/khidmat-universal.apk.sha256').write_text(digest + '  khidmat-universal.apk\n')
          with zipfile.ZipFile(apk) as archive:
              libraries = sorted(n for n in archive.namelist() if n.startswith('lib/') and n.endswith('/libapp.so'))
          Path('release/artifacts.json').write_text(json.dumps({
              'file': apk.name, 'bytes': apk.stat().st_size, 'sha256': digest,
              'versionName': '2.1.1', 'versionCode': 5005, 'minimumAndroidApi': 24,
              'signerSha256': '7c680b76c6d8ba235ebc72b68b05038ecaddb0d38e7d776f977695db2cdacebd',
              'nativeLibraries': libraries, 'signatureVerified': True, 'alignment16KBVerified': True,
              'internetPermission': True,
          }, indent=2) + '\n')
          PY
          python3 scripts/verify_release.py release
      - uses: actions/upload-artifact@v4
        with:
          name: khidmat-signed-android
          path: |
            release/khidmat-universal.apk
            release/khidmat-universal.apk.sha256
            release/SHA256SUMS
            release/artifacts.json
          retention-days: 14
      - name: Remove runner signing files
        if: always()
        run: rm -f android/khidmat-release.jks android/key.properties config/marketplace.json
