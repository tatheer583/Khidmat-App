name: Verify Khidmat mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_security.mjs
      - run: node --test test/security_scripts_test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Prepare Android project
        shell: pwsh
        run: ./scripts/Prepare-Android.ps1
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build Android release for runtime testing
        env:
          KHIDMAT_TEST_BUILD: 'true'
        run: flutter build apk --release --no-pub --target-platform android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: khidmat-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch with Wi-Fi and mobile data disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/smoke_android.py build/app/outputs/flutter-apk/app-release.apk --offline --exercise-local-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: smoke-evidence/
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile for physical iOS (unsigned)
        run: flutter build ios --release --no-codesign --no-pub
      - name: Compile simulator
        run: flutter build ios --simulator --debug --no-pub
      - name: Install and launch iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for a in json.load(sys.stdin)["devices"].values() for d in a if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.khidmat.khidmat
          sleep 15
          mkdir -p ios-evidence
          xcrun simctl io "$DEVICE" screenshot ios-evidence/startup.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep com.khidmat.khidmat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-runtime-evidence
          path: |
            ios-evidence/
            build/ios/iphoneos/Runner.app/
          retention-days: 7
