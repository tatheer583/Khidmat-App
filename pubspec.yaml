name: khidmat
description: Khidmat worker contacts, profiles and job planning saved on your phone.
publish_to: 'none'
version: 2.0.0+5003

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  go_router: ^14.2.7
  provider: ^6.1.2
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
