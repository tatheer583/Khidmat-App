name: khidmat
description: Khidmat local services marketplace with private offline contacts and appointments.
publish_to: 'none'
version: 2.1.0+5004

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  go_router: ^14.2.7
  provider: ^6.1.2
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.18.0
  geolocator: ^14.1.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
