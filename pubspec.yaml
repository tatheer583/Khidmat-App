name: khidmat
description: Khidmat service bookings with Supabase authentication, storage and realtime updates.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.0
  image_picker: ^1.2.0
  go_router: ^14.2.7
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
